<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Bot</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fff; --muted: #6e6e73; --line: #d2d2d7; --accent: #0a66c2; --card: #f5f5f7; --error: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --bg: #111; --muted: #a1a1a6; --line: #3a3a3c; --accent: #4ea1ff; --card: #1c1c1e; --error: #ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  label { font-size: .9rem; color: var(--muted); }
  input, select, button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  #message { flex: 1; min-width: 0; }
  button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--fg); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  button.recording { background: var(--error); border-color: var(--error); color: #fff; }
  #log { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .q { font-weight: 600; }
  .a { background: var(--card); border-radius: 10px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .error { color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Grammar Bot</h1>
  <div class="row">
    <label for="key">API key</label>
    <input id="key" type="password" autocomplete="off" placeholder="X-API-Key">
    <label for="level">Level</label>
    <select id="level">
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
    </select>
    <button id="reset" type="button" class="secondary">New conversation</button>
  </div>
  <form id="form" class="row">
    <input id="message" aria-label="Question" maxlength="2000" required placeholder="When do I use present perfect?">
    <button id="mic" type="button" class="secondary" aria-pressed="false">🎤 Speak</button>
    <button id="send">Ask</button>
  </form>
  <div id="log" aria-live="polite"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let sessionId = null;

  // The key is remembered in this browser only; it is never part of the page.
  try { $("key").value = localStorage.getItem("apiKey") || ""; } catch {}
  $("key").addEventListener("change", () => { try { localStorage.setItem("apiKey", $("key").value); } catch {} });
  $("reset").addEventListener("click", () => { sessionId = null; $("log").replaceChildren(); $("message").focus(); });

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    $("log").append(el);
    return el;
  }

  async function fail(res) {
    const { detail } = await res.json().catch(() => ({}));
    throw new Error(Array.isArray(detail) ? detail[0].msg : detail || `HTTP ${res.status}`);
  }

  async function ask(message, answer) {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": $("key").value },
      body: JSON.stringify({ message, level: $("level").value, session_id: sessionId, stream: true }),
    });
    if (!res.ok) await fail(res);
    // EventSource can't POST, so read the SSE stream by hand: events are separated by a blank line.
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) return;
      buffer += value;
      const events = buffer.split("\n\n");
      buffer = events.pop();
      for (const event of events) {
        if (!event.startsWith("data: ")) continue;
        const data = JSON.parse(event.slice(6));
        if (data.delta) answer.textContent += data.delta;
        if (data.done) sessionId = data.session_id;
        if (data.error) throw new Error(data.error);
      }
    }
  }

  async function submit(message) {
    $("send").disabled = $("mic").disabled = true;
    add("q", message);
    const answer = add("a", "");
    try {
      await ask(message, answer);
    } catch (err) {
      add("error", err.message);
    } finally {
      $("send").disabled = false;
      $("mic").disabled = !micSupported;
      $("message").focus();
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const message = $("message").value.trim();
    $("message").value = "";
    if (message) submit(message);
  });

  // --- Voice: record, convert to 16 kHz mono WAV (what /stt accepts), transcribe, then ask. ---
  const MAX_RECORDING_MS = 30000; // /stt is meant for clips up to about 30 s
  const micSupported = Boolean(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
  let recorder = null;
  if (!micSupported) {
    $("mic").disabled = true;
    $("mic").title = "The microphone needs HTTPS: open the page through its ts.net address";
  }

  function setMic(label, { busy = false, recording = false } = {}) {
    $("mic").textContent = label;
    $("mic").disabled = busy;
    $("mic").classList.toggle("recording", recording);
    $("mic").setAttribute("aria-pressed", String(recording));
  }

  async function toWav(blob) {
    const RATE = 16000;
    // Decoding in a 16 kHz context also resamples; the first channel is enough for speech.
    const audio = await new OfflineAudioContext(1, 1, RATE).decodeAudioData(await blob.arrayBuffer());
    const pcm = audio.getChannelData(0);
    // 44-byte header for 16-bit mono PCM, then the samples.
    const view = new DataView(new ArrayBuffer(44 + pcm.length * 2));
    const ascii = (offset, s) => [...s].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
    ascii(0, "RIFF"); view.setUint32(4, 36 + pcm.length * 2, true); ascii(8, "WAVE");
    ascii(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, RATE, true); view.setUint32(28, RATE * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    ascii(36, "data"); view.setUint32(40, pcm.length * 2, true);
    pcm.forEach((sample, i) => view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, sample)) * 0x7fff, true));
    return new Blob([view], { type: "audio/wav" });
  }

  async function transcribe(wav) {
    const res = await fetch("/stt", { method: "POST", headers: { "Content-Type": "audio/wav", "X-API-Key": $("key").value }, body: wav });
    if (!res.ok) await fail(res);
    return (await res.json()).text;
  }

  $("mic").addEventListener("click", async () => {
    if (recorder) return recorder.stop();
    let stream;
    setMic("Starting…", { busy: true }); // the permission prompt and mic startup can take a second or two
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      setMic("🎤 Speak");
      return add("error", `Microphone unavailable: ${err.message}`);
    }
    const chunks = [];
    const rec = (recorder = new MediaRecorder(stream));
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((track) => track.stop()); // releases the mic indicator
      recorder = null;
      setMic("Transcribing…", { busy: true });
      try {
        const text = await transcribe(await toWav(new Blob(chunks, { type: rec.mimeType })));
        if (!text) throw new Error("Didn't catch any speech. Try again, a bit closer to the mic.");
        await submit(text);
      } catch (err) {
        add("error", err.message);
      } finally {
        setMic("🎤 Speak");
      }
    };
    rec.start();
    setMic("■ Stop", { recording: true });
    setTimeout(() => rec.state === "recording" && rec.stop(), MAX_RECORDING_MS);
  });
</script>
</body>
</html>
